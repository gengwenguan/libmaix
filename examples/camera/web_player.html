<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera WebSocket Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 20px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }

        #videoCanvas {
            width: 100%;
            height: auto;
            display: block;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,114,255,0.4);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,65,108,0.4);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
        }

        .status {
            text-align: center;
            color: white;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }

        .status.connected {
            background: rgba(0,255,0,0.2);
        }

        .status.disconnected {
            background: rgba(255,0,0,0.2);
        }

        .info-panel {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 15px;
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .info-panel h3 {
            margin-bottom: 10px;
            color: #00c6ff;
        }

        .log-entry {
            margin: 5px 0;
            padding: 5px;
            background: rgba(255,255,255,0.05);
            border-radius: 5px;
        }

        .server-config {
            margin-bottom: 20px;
            text-align: center;
        }

        .server-config input {
            padding: 10px 15px;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            width: 250px;
            margin-right: 10px;
        }

        .server-config input::placeholder {
            color: rgba(255,255,255,0.6);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            color: white;
        }

        .stat-card h4 {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
            color: #00c6ff;
        }
    </style>
</head>
<body>
    <h1>🎥 Camera WebSocket Player</h1>

    <div class="container">
        <div class="server-config">
            <input type="text" id="serverIp" placeholder="输入设备IP地址" value="192.168.1.100">
        </div>

        <div class="video-container">
            <canvas id="videoCanvas" width="640" height="480"></canvas>
        </div>

        <div class="status disconnected" id="status">
            未连接 - 请点击"开始直播"按钮
        </div>

        <div class="stats">
            <div class="stat-card">
                <h4>视频帧率</h4>
                <div class="value" id="fps">0</div>
            </div>
            <div class="stat-card">
                <h4>音频帧率</h4>
                <div class="value" id="audioFps">0</div>
            </div>
            <div class="stat-card">
                <h4>数据速率</h4>
                <div class="value" id="bitrate">0</div>
            </div>
            <div class="stat-card">
                <h4>连接状态</h4>
                <div class="value" id="connectionStatus">离线</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="startLive()">开始直播</button>
            <button class="btn-danger" onclick="stopLive()">停止直播</button>
            <button class="btn-secondary" onclick="startPlayback()">开始回放</button>
            <button class="btn-secondary" onclick="stopPlayback()">停止回放</button>
        </div>

        <div class="controls">
            <button class="btn-secondary" onclick="sendCommand(101)">快退</button>
            <button class="btn-secondary" onclick="sendCommand(102)">快进</button>
            <button class="btn-secondary" onclick="sendCommand(104)">上一个文件</button>
            <button class="btn-secondary" onclick="sendCommand(105)">下一个文件</button>
            <button class="btn-secondary" onclick="sendCommand(107)">加速</button>
            <button class="btn-secondary" onclick="sendCommand(108)">正常速度</button>
        </div>

        <div class="info-panel">
            <h3>📊 系统日志</h3>
            <div id="logContainer"></div>
        </div>
    </div>

    <script>
        // WebSocket连接
        let liveWs = null;
        let playbackWs = null;

        // 解码器
        let videoDecoder = null;
        let audioDecoder = null;

        // Canvas
        const canvas = document.getElementById('videoCanvas');
        const ctx = canvas.getContext('2d');

        // 音频上下文
        let audioContext = null;
        let audioQueue = [];
        let nextAudioTime = 0;

        // 统计信息
        let videoFrameCount = 0;
        let audioFrameCount = 0;
        let lastStatsTime = Date.now();
        let totalBytes = 0;

        // 日志函数
        function log(message) {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            container.insertBefore(entry, container.firstChild);

            // 限制日志数量
            while (container.children.length > 50) {
                container.removeChild(container.lastChild);
            }
        }

        // 更新状态
        function updateStatus(message, connected) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + (connected ? 'connected' : 'disconnected');
            document.getElementById('connectionStatus').textContent = connected ? '在线' : '离线';
        }

        // 初始化视频解码器
        async function initVideoDecoder() {
            if (!('VideoDecoder' in window)) {
                log('错误: 浏览器不支持WebCodecs API');
                return false;
            }

            videoDecoder = new VideoDecoder({
                output: (videoFrame) => {
                    // 渲染视频帧
                    ctx.drawImage(videoFrame, 0, 0, canvas.width, canvas.height);
                    videoFrame.close();
                    videoFrameCount++;
                },
                error: (error) => {
                    log(`视频解码错误: ${error.message}`);
                }
            });

            await videoDecoder.configure({
                codec: 'avc1.42E01E',
                codedWidth: 640,
                codedHeight: 480
            });

            return true;
        }

        // 初始化音频解码器
        async function initAudioDecoder() {
            if (!('AudioDecoder' in window)) {
                log('警告: 浏览器不支持音频解码');
                return false;
            }

            audioContext = new (window.AudioContext || window.webkitAudioContext)({
                sampleRate: 48000
            });

            audioDecoder = new AudioDecoder({
                output: (audioData) => {
                    playAudio(audioData);
                    audioData.close();
                    audioFrameCount++;
                },
                error: (error) => {
                    log(`音频解码错误: ${error.message}`);
                }
            });

            await audioDecoder.configure({
                codec: 'opus',
                sampleRate: 48000,
                numberOfChannels: 2
            });

            return true;
        }

        // 播放音频
        function playAudio(audioData) {
            const buffer = audioContext.createBuffer(
                audioData.numberOfChannels,
                audioData.numberOfFrames,
                audioData.sampleRate
            );

            for (let i = 0; i < audioData.numberOfChannels; i++) {
                const channelData = buffer.getChannelData(i);
                const sourceData = audioData.getChannelData(i);
                channelData.set(sourceData);
            }

            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);

            const currentTime = audioContext.currentTime;
            if (nextAudioTime < currentTime) {
                nextAudioTime = currentTime;
            }

            source.start(nextAudioTime);
            nextAudioTime += buffer.duration;
        }

        // 解析数据包
        function parsePacket(data) {
            const view = new DataView(data.buffer);
            const length = view.getUint32(0);
            const flag = data[4];
            const payload = data.slice(5);

            return { length, flag, payload };
        }

        // 检查是否为关键帧
        function isKeyFrame(h264Data) {
            let offset = 0;
            if (h264Data[0] === 0 && h264Data[1] === 0 && h264Data[2] === 0 && h264Data[3] === 1) {
                offset = 4;
            } else if (h264Data[0] === 0 && h264Data[1] === 0 && h264Data[2] === 1) {
                offset = 3;
            }
            const nalType = h264Data[offset] & 0x1F;
            return nalType === 5;
        }

        // 开始直播
        async function startLive() {
            const serverIp = document.getElementById('serverIp').value;
            if (!serverIp) {
                alert('请输入设备IP地址');
                return;
            }

            // 初始化解码器
            if (!videoDecoder) {
                const success = await initVideoDecoder();
                if (!success) return;
            }

            if (!audioDecoder) {
                await initAudioDecoder();
            }

            // 建立WebSocket连接
            const wsUrl = `ws://${serverIp}:56070`;
            log(`连接到直播服务器: ${wsUrl}`);

            liveWs = new WebSocket(wsUrl);
            liveWs.binaryType = 'arraybuffer';

            liveWs.onopen = () => {
                log('直播WebSocket连接成功');
                updateStatus('直播连接成功', true);
            };

            liveWs.onmessage = async (event) => {
                const data = new Uint8Array(event.data);
                totalBytes += data.length;

                const packet = parsePacket(data);

                if (packet.flag === 0x80) { // 视频
                    const isKey = isKeyFrame(packet.payload);
                    const chunk = new EncodedVideoChunk({
                        type: isKey ? 'key' : 'delta',
                        timestamp: performance.now() * 1000,
                        data: packet.payload
                    });

                    try {
                        await videoDecoder.decode(chunk);
                    } catch (e) {
                        log(`视频解码失败: ${e.message}`);
                    }
                } else { // 音频
                    const chunk = new EncodedAudioChunk({
                        type: 'key',
                        timestamp: performance.now() * 1000,
                        data: packet.payload
                    });

                    try {
                        await audioDecoder.decode(chunk);
                    } catch (e) {
                        log(`音频解码失败: ${e.message}`);
                    }
                }
            };

            liveWs.onerror = (error) => {
                log('直播WebSocket错误');
                updateStatus('直播连接错误', false);
            };

            liveWs.onclose = () => {
                log('直播WebSocket连接关闭');
                updateStatus('直播已断开', false);
            };
        }

        // 停止直播
        function stopLive() {
            if (liveWs) {
                liveWs.close();
                liveWs = null;
            }
            updateStatus('直播已停止', false);
        }

        // 开始回放
        async function startPlayback() {
            const serverIp = document.getElementById('serverIp').value;
            if (!serverIp) {
                alert('请输入设备IP地址');
                return;
            }

            // 初始化解码器
            if (!videoDecoder) {
                const success = await initVideoDecoder();
                if (!success) return;
            }

            if (!audioDecoder) {
                await initAudioDecoder();
            }

            // 建立WebSocket连接
            const wsUrl = `ws://${serverIp}:56080`;
            log(`连接到回放服务器: ${wsUrl}`);

            playbackWs = new WebSocket(wsUrl);
            playbackWs.binaryType = 'arraybuffer';

            playbackWs.onopen = () => {
                log('回放WebSocket连接成功');
                updateStatus('回放连接成功', true);
            };

            playbackWs.onmessage = async (event) => {
                const data = new Uint8Array(event.data);
                totalBytes += data.length;

                const packet = parsePacket(data);

                if (packet.flag === 0x80) { // 视频
                    const isKey = isKeyFrame(packet.payload);
                    const chunk = new EncodedVideoChunk({
                        type: isKey ? 'key' : 'delta',
                        timestamp: performance.now() * 1000,
                        data: packet.payload
                    });

                    try {
                        await videoDecoder.decode(chunk);
                    } catch (e) {
                        log(`视频解码失败: ${e.message}`);
                    }
                } else { // 音频
                    const chunk = new EncodedAudioChunk({
                        type: 'key',
                        timestamp: performance.now() * 1000,
                        data: packet.payload
                    });

                    try {
                        await audioDecoder.decode(chunk);
                    } catch (e) {
                        log(`音频解码失败: ${e.message}`);
                    }
                }
            };

            playbackWs.onerror = (error) => {
                log('回放WebSocket错误');
                updateStatus('回放连接错误', false);
            };

            playbackWs.onclose = () => {
                log('回放WebSocket连接关闭');
                updateStatus('回放已断开', false);
            };
        }

        // 停止回放
        function stopPlayback() {
            if (playbackWs) {
                playbackWs.close();
                playbackWs = null;
            }
            updateStatus('回放已停止', false);
        }

        // 发送控制命令
        function sendCommand(cmd) {
            if (!playbackWs || playbackWs.readyState !== WebSocket.OPEN) {
                log('错误: 回放未连接');
                return;
            }

            const commandNames = {
                101: '快退',
                102: '快进',
                104: '上一个文件',
                105: '下一个文件',
                107: '加速',
                108: '正常速度'
            };

            playbackWs.send(new Uint8Array([cmd]));
            log(`发送命令: ${commandNames[cmd] || cmd}`);
        }

        // 更新统计信息
        setInterval(() => {
            const now = Date.now();
            const elapsed = (now - lastStatsTime) / 1000;

            document.getElementById('fps').textContent = Math.round(videoFrameCount / elapsed);
            document.getElementById('audioFps').textContent = Math.round(audioFrameCount / elapsed);
            document.getElementById('bitrate').textContent = Math.round((totalBytes * 8) / elapsed / 1024) + ' Kbps';

            videoFrameCount = 0;
            audioFrameCount = 0;
            totalBytes = 0;
            lastStatsTime = now;
        }, 1000);

        // 页面加载完成
        window.onload = () => {
            log('页面加载完成');
            log('支持WebCodecs API: ' + ('VideoDecoder' in window));
        };

        // 页面关闭时清理
        window.onbeforeunload = () => {
            stopLive();
            stopPlayback();
        };
    </script>
</body>
</html>
